name: Reader validation
on:
  push:
    branches: [feat/multibook-pbrt-companion]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reader-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/multibook-pbrt-companion'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base-checked one-time migration
        run: |
          if test -f _platform_seed/apply.py; then
            python3 _platform_seed/apply.py
            git add src
            git rm -r _platform_seed
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: preserve contextual lesson typing after extraction'
            git push origin HEAD:feat/multibook-pbrt-companion
          fi
  check:
    needs: migrate
    if: always() && !cancelled() && needs.migrate.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'feat/multibook-pbrt-companion' }}
      - run: mkdir -p validation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-reader.mjs > validation/reader-report.json
      - run: node scripts/check-platform.mjs > validation/platform-report.json
      - name: Install browser test tools
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Real browser tests
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > validation/server.log 2>&1 &
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
          python3 scripts/check-browser.py
      - name: Official source TOC mapping
        if: always()
        run: node scripts/check-source-outline.mjs > validation/source-report.json
      - name: Source snapshot for review
        if: always()
        run: |
          git rev-parse HEAD > validation/tested-commit.txt
          tar -czf validation/changed-source.tar.gz src scripts docs README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-validation
          path: validation
          retention-days: 7
