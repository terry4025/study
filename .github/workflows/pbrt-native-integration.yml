name: PBRT native reader checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pbrt-native-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate checked translations and Python tools
        run: |
          python3 tools/pbrt/check_ch10.py
          python3 tools/pbrt/check_ch11.py
          python3 tools/pbrt/check_ch12.py
          python3 -m compileall -q tools/pbrt
      - name: Exercise chapter 12 import with source fixtures
        run: |
          python3 -m pip install -r tools/pbrt/requirements-native.txt
          python3 tools/pbrt/test_ch12.py -v
      - name: Install exact project dependencies and build
        run: |
          npm ci
          npm run build
      - name: Install browser test runtime without changing lockfile
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check real local browser storage and navigation with fixtures
        run: node tools/pbrt/browser_smoke.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-browser-check-results
          path: native-browser-smoke-result.json
          if-no-files-found: ignore
