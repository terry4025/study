name: PBRT final core1 translation
on:
  push:
    branches: [feat/pbrt-complete-book-20260922]
    paths:
      - '.github/workflows/pbrt-final-core1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translate-core1:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install translation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.46.3" sentencepiece beautifulsoup4 lxml requests safetensors
      - name: Generate corrected chapters 2 and 3
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python tools/pbrt/translate_complete_draft.py --batch core1 --out generated/core1 --repo .
      - uses: actions/upload-artifact@v5
        with:
          name: pbrt-final-core1
          path: generated/core1
          retention-days: 7
