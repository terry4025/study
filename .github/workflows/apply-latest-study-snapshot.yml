name: Apply latest study snapshot
on:
  push:
    branches: [sync/latest-study-20260920]
    paths: ['tools/pbrt/snapshots/latest/APPLY']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          echo '098f3b2e55805028a25dfe447b243348d86dee58d867e6c4222366406483b7ba  tools/pbrt/snapshots/latest/source.patch.xz' | sha256sum -c -
          xz -dc tools/pbrt/snapshots/latest/source.patch.xz >/tmp/source.patch
          echo '7dccf53b36d0b65bcb0944f1c32254fb9f547ec186b062e726945d8e0b6cb68a  /tmp/source.patch' | sha256sum -c -
          git apply --check /tmp/source.patch
          git apply /tmp/source.patch
      - name: Commit via GitHub API
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const owner = context.repo.owner, repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/','');
            const ref = await github.rest.git.getRef({owner,repo,ref:'heads/'+branch});
            const parent = ref.data.object.sha;
            const base = await github.rest.git.getCommit({owner,repo,commit_sha:parent});
            const lines = s => s.toString('utf8').split('\n').map(x=>x.trim()).filter(Boolean);
            const modified = lines(cp.execFileSync('git',['diff','--name-only','--diff-filter=ACMRT','HEAD']));
            const untracked = lines(cp.execFileSync('git',['ls-files','--others','--exclude-standard']));
            const deleted = lines(cp.execFileSync('git',['diff','--name-only','--diff-filter=D','HEAD']));
            const files = [...new Set([...modified,...untracked])].filter(path =>
              !path.startsWith('tools/pbrt/snapshots/latest/') &&
              fs.existsSync(path) && fs.statSync(path).isFile()
            );
            const tree = [];
            for (const path of files) {
              const data=fs.readFileSync(path).toString('base64');
              const blob=await github.rest.git.createBlob({owner,repo,content:data,encoding:'base64'});
              tree.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            for (const path of deleted) {
              if (!path.startsWith('tools/pbrt/snapshots/latest/'))
                tree.push({path,mode:'100644',type:'blob',sha:null});
            }
            if (!tree.length) throw new Error('Patch produced no repository changes');
            const nt=await github.rest.git.createTree({owner,repo,base_tree:base.data.tree.sha,tree});
            const nc=await github.rest.git.createCommit({owner,repo,message:'sync: apply latest reviewed study files',tree:nt.data.sha,parents:[parent]});
            await github.rest.git.updateRef({owner,repo,ref:'heads/'+branch,sha:nc.data.sha,force:false});
            core.info('Created '+nc.data.sha+' with '+tree.length+' files');
