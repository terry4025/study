name: PBRT final Korean post-edit
on:
  push:
    branches: [feat/pbrt-complete-book-20260922]
    paths:
      - 'tools/pbrt/postedit_complete_translation.py'
      - '.github/workflows/pbrt-final-language-pass.yml'
permissions:
  contents: write
jobs:
  postedit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/pbrt-complete-book-20260922
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply final Korean post-edit
        run: python3 tools/pbrt/postedit_complete_translation.py
      - name: Verify no omissions and reject known MT artifacts
        run: |
          python3 tools/pbrt/check_complete_source_translations.py
          python3 - <<'PY'
          import json,re,pathlib
          bad=[
            r'렌더링링',r'그리고\.',r'인테그랜드',r'저-미분',r'저미분',
            r'푸른 노이즈',r'덩어리 덩어리',r'[・]{3,}',r'with with',
            r'기술 상태',r'우리는 를',r'\{\{\d+\}\}\s+s\b',r'\ba\s+\{\{'
          ]
          hits=[]
          for ch in range(3,9):
            for p in pathlib.Path(f'translations/pbrt/ch{ch:02d}').glob('*.ko.json'):
              d=json.loads(p.read_text(encoding='utf8'))
              for uid,t in d.get('translations',{}).items():
                for pat in bad:
                  if re.search(pat,t): hits.append((str(p),uid,pat,t[:180]))
          if hits:
            print(*hits[:50],sep='\n');raise SystemExit(f'{len(hits)} known MT artifacts remain')
          print('known MT artifact scan passed')
          PY
          python3 -m compileall -q tools/pbrt
      - name: Build application
        run: |
          npm ci
          npm run build
      - name: Commit post-edited translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/pbrt/ch03 translations/pbrt/ch04 translations/pbrt/ch05 translations/pbrt/ch06 translations/pbrt/ch07 translations/pbrt/ch08
          if git diff --cached --quiet; then
            echo "No translation changes."
          else
            git commit -m "fix(pbrt): final Korean language post-edit for chapters 3-8"
            git push origin HEAD:feat/pbrt-complete-book-20260922
          fi

