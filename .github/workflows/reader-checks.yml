name: Reader checks
on:
  push:
    branches: [main, feat/reader-rebuild-beginner-course]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Validate learning content
        run: npm run check:content
      - name: Type check and production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests and screenshots
        run: npm run test:e2e
      - name: Upload check report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-check-results
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
