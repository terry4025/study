name: Reader checks
on:
  push:
    branches: [main, feat/reader-rebuild-beginner-course]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and resolve lockfile
        run: npm install --no-fund --no-audit
      - name: Validate learning content
        run: npm run check:content
      - name: Type check and production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests and screenshots
        run: npm run test:e2e
      - name: Preserve the resolved lockfile on the feature branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feat/reader-rebuild-beginner-course'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: lock verified reader dependencies'
            git push origin HEAD:feat/reader-rebuild-beginner-course
          fi
      - name: Upload check report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-check-results
          path: |
            artifacts/
            playwright-report/
            test-results/
            package-lock.json
          retention-days: 14
