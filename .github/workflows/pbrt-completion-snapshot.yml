name: PBRT completion snapshot
on:
  push:
    branches: ['finish/pbrt-complete-source-20260920']
    paths:
      - '.github/workflows/pbrt-completion-snapshot.yml'
      - 'tools/pbrt/completion-checkpoint.txt'
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: finish/pbrt-complete-source-20260920
      - name: Validate JSON and remove exact accidental string delimiters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          bad='\",\"+\n\"\n '
          for p in Path('translations/pbrt').rglob('*.ko.json'):
              text=p.read_text(encoding='utf8')
              try:
                  data=json.loads(text)
              except json.JSONDecodeError:
                  if bad not in text:
                      raise
                  repaired=text.replace(bad,'\",\n ')
                  data=json.loads(repaired)
                  p.write_text(repaired,encoding='utf8')
                  print('Repaired exact serialization delimiter:',p,text.count(bad))
              assert isinstance(data.get('translations'),dict),str(p)
          PY
      - name: Preserve reviewed serialization repairs on the working branch
        run: |
          if ! git diff --quiet -- translations/pbrt; then
            git config user.name 'pbrt-completion-check'
            git config user.email 'pbrt-completion-check@users.noreply.github.com'
            git add -- translations/pbrt
            git commit -m 'fix(pbrt): normalize invalid serialized string delimiters'
            git push origin HEAD:finish/pbrt-complete-source-20260920
          fi
      - name: Archive tracked inputs
        run: git archive --format=zip --output=completion-source.zip HEAD translations tools src docs package.json package-lock.json tsconfig.json vite.config.ts index.html
      - uses: actions/upload-artifact@v5
        with:
          name: pbrt-completion-source
          path: completion-source.zip
          retention-days: 7
