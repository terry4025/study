name: PBRT repair chapter 2 alignment
on:
  push:
    branches: [feat/pbrt-complete-book-20260922]
    paths:
      - '.github/workflows/pbrt-repair-ch02-final.yml'
permissions:
  contents: write
  actions: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '35686230327'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/pbrt-complete-book-20260922
          fetch-depth: 0
      - name: Download chapter 2 aligned artifact
        run: |
          mkdir -p generated/ch02
          gh run download "${SOURCE_RUN}" -n pbrt-translation-ch02 -D generated/ch02
      - name: Import with source-path remapping
        run: python3 tools/pbrt/import_translation_artifacts.py --input generated/ch02 --repo . --chapters 02
      - name: Verify chapter 2 counts
        run: |
          python3 - <<'PY'
          import json,pathlib
          expect={'02-00':5,'02-01':61,'02-02':72,'02-03':36,'02-04':36,'02-reading':45,'02-exercises':4}
          for key,n in expect.items():
              p=pathlib.Path('translations/pbrt/ch02')/(key+'.ko.json')
              d=json.loads(p.read_text(encoding='utf8'))
              got=len(d.get('translations',{}))+len(d.get('preserved_reference_ids',[]))
              assert got==n,(key,got,n)
          print('chapter 2 aligned')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/pbrt/ch02
          git commit -m "fix(pbrt): realign chapter 2 source units" || true
          git push origin HEAD:feat/pbrt-complete-book-20260922
